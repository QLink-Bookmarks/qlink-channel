name: preview 빌드 (EAS)

# preview 브랜치 push/merge 시 EAS preview 워크플로(fingerprint -> build or OTA)를 트리거한다.
# EAS<->GitHub 조직 연동 없이, EXPO_CI_TOKEN으로 `eas workflow:run`을 호출하는 방식.
on:
  push:
    branches:
      - preview

jobs:
  trigger_preview:
    name: Trigger EAS preview workflow
    uses: ./.github/workflows/_eas-workflow.yaml
    with:
      workflow_file: .eas/workflows/preview.yml
    secrets: inherit
