name: 개발환경 배포

# main push 시 개발용 웹을 Amplify(dev 브랜치)에 배포한다.
# 배포 절차는 _web-amplify.yaml 에서 관리한다.
on:
  push:
    branches:
      - main

jobs:
  deploy_dev:
    name: Deploy Dev
    uses: ./.github/workflows/_web-amplify.yaml
    with:
      environment: dev
      amplify_branch: dev
    secrets: inherit
