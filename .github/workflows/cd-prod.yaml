name: 운영환경 배포 (release)

# release 브랜치 push/merge 시:
#  1) deploy_web    : 운영 웹 정적 빌드 -> Amplify(prod 브랜치) 배포
#  2) trigger_native: EAS production 워크플로(fingerprint -> build+submit or OTA) 트리거
# 두 절차 모두 재사용 워크플로에 있고, 여기서는 환경/대상만 지정한다.
on:
  push:
    branches:
      - release

jobs:
  deploy_web:
    name: Deploy Web (Amplify prod)
    uses: ./.github/workflows/_web-amplify.yaml
    with:
      environment: Production
      amplify_branch: prod
    secrets: inherit

  trigger_native:
    name: Trigger EAS production workflow
    uses: ./.github/workflows/_eas-workflow.yaml
    with:
      workflow_file: .eas/workflows/production.yml
    secrets: inherit
