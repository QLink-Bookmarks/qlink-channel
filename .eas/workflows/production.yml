name: Release (TestFlight build or OTA)

# release 브랜치 배포용 (flight 워크플로를 대체). fingerprint로 네이티브 변경 여부를 판단:
#  - 지문 변경: EAS production 프로필로 build -> submit (App Store Connect / TestFlight)
#  - 지문 동일: production 브랜치로 OTA update (새 바이너리 없음)
# submit(TestFlight) 성공엔 eas.json submit.production에 Apple 값
# (ASC API Key 또는 appleId/ascAppId/appleTeamId)이 채워져야 한다.
# share extension은 expo-updates를 제외하므로 OTA로는 갱신되지 않는다 (네이티브 재빌드 필요).

on:
  push:
    branches:
      - release

jobs:
  fingerprint:
    type: fingerprint
    environment: production

  get_ios_build:
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production

  build_ios:
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  update_ios:
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: production
    params:
      platform: ios
      branch: production
